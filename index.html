<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment form example</title>

  <!-- Bootstrap 5 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <!-- Bootstrap Icons (para los logos de tarjetas) -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
  />

  <style>
    body {
      background-color: #2b2b2b;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .card-header,
    .card-footer {
      background-color: #f5f5f5;
    }
    .card-header h5 {
      margin: 0;
      font-weight: 600;
    }
    .form-label {
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 0.35rem;
    }
    .helper-text {
      font-size: 0.85rem;
      color: #6c757d;
      margin-top: 0.25rem;
    }
    .payment-methods {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .payment-method {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background-color: #3d3d3d;
      color: #fff;
      padding: 0.4rem 0.7rem;
      border-radius: 4px;
      cursor: pointer;
    }
    .payment-method input[type="radio"] {
      margin: 0;
      accent-color: #fff;
    }
    .payment-method i {
      font-size: 1.1rem;
    }
    .btn-cancel {
      background-color: #5a5a5a;
      color: #fff;
      border: none;
    }
    .btn-cancel:hover {
      background-color: #4a4a4a;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="container" style="max-width: 900px;">
    <div class="card shadow-sm">
      <!-- Header -->
      <div class="card-header py-3">
        <h5>Payment form example</h5>
      </div>

      <!-- Body -->
      <div class="card-body p-4">
        <!-- Alerta de error -->
        <div class="alert alert-danger py-2" role="alert">
          Some fields are missing
        </div>

        <!-- Fila 1: Card # | CVC # | Amount -->
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label for="card" class="form-label">Card #</label>
            <input
              type="text"
              class="form-control"
              id="card"
              placeholder="XXXXXXXXXXXXXXXX"
            />
          </div>
          <div class="col-md-3">
            <label for="cvc" class="form-label">CVC #</label>
            <input
              type="text"
              class="form-control"
              id="cvc"
              placeholder="0000"
            />
          </div>
          <div class="col-md-3">
            <label for="amount" class="form-label">Amount</label>
            <div class="input-group">
              <span class="input-group-text">$</span>
              <input
                type="text"
                class="form-control"
                id="amount"
                placeholder="Amount"
              />
            </div>
          </div>
        </div>

        <!-- Fila 2: First Name | Last Name -->
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label for="firstName" class="form-label">First Name</label>
            <input type="text" class="form-control" id="firstName" />
          </div>
          <div class="col-md-6">
            <label for="lastName" class="form-label">Last Name</label>
            <input type="text" class="form-control" id="lastName" />
          </div>
        </div>

        <!-- Fila 3: City | State | Postal Code -->
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label for="city" class="form-label">City</label>
            <input type="text" class="form-control" id="city" />
          </div>
          <div class="col-md-3">
            <label for="state" class="form-label">State</label>
            <select class="form-select" id="state">
              <option selected>Pick a state</option>
              <option>California</option>
              <option>Texas</option>
              <option>New York</option>
              <option>Florida</option>
            </select>
          </div>
          <div class="col-md-3">
            <label for="postal" class="form-label">Postal Code</label>
            <input type="text" class="form-control" id="postal" />
          </div>
        </div>

        <!-- Fila 4: We accept | Message -->
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label d-block">We accept:</label>
            <div class="payment-methods">
              <label class="payment-method">
                <input type="radio" name="payment" />
                <i class="bi bi-credit-card-2-front"></i>
              </label>
              <label class="payment-method">
                <input type="radio" name="payment" />
                <i class="bi bi-credit-card"></i>
              </label>
              <label class="payment-method">
                <input type="radio" name="payment" />
                <i class="bi bi-paypal"></i>
              </label>
              <label class="payment-method">
                <input type="radio" name="payment" />
                <i class="bi bi-cash-stack"></i>
              </label>
            </div>
          </div>
          <div class="col-md-6">
            <label for="message" class="form-label">Message</label>
            <textarea
              class="form-control"
              id="message"
              rows="3"
            ></textarea>
            <div class="helper-text">Add any notes here.</div>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="card-footer text-end py-3">
        <button type="button" class="btn btn-cancel">Cancel</button>
        <button type="button" class="btn btn-primary">Send</button>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
