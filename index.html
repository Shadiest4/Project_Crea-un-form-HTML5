<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment form example</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
  />
</head>
<body class="bg-dark py-5">
  <div class="container" style="max-width: 900px;">
    <div class="card shadow-sm">
      <div class="card-header bg-light py-3">
        <h5 class="mb-0 fw-semibold">Payment form example</h5>
      </div>
      <div class="card-body p-4">
        <div class="alert alert-danger py-2" role="alert">
          Some fields are missing
        </div>
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label for="card" class="form-label fw-semibold">Card #</label>
            <input
              type="text"
              class="form-control"
              id="card"
              placeholder="XXXXXXXXXXXXXXXX"
            />
          </div>
          <div class="col-md-3">
            <label for="cvc" class="form-label fw-semibold">CVC #</label>
            <input
              type="text"
              class="form-control"
              id="cvc"
              placeholder="0000"
            />
          </div>
          <div class="col-md-3">
            <label for="amount" class="form-label fw-semibold">Amount</label>
            <div class="input-group">
              <span class="input-group-text">$</span>
              <input
                type="text"
                class="form-control"
                id="amount"
                placeholder="Amount"
              />
            </div>
          </div>
        </div>
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label for="firstName" class="form-label fw-semibold">First Name</label>
            <input type="text" class="form-control" id="firstName" />
          </div>
          <div class="col-md-6">
            <label for="lastName" class="form-label fw-semibold">Last Name</label>
            <input type="text" class="form-control" id="lastName" />
          </div>
        </div>
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label for="city" class="form-label fw-semibold">City</label>
            <input type="text" class="form-control" id="city" />
          </div>
          <div class="col-md-3">
            <label for="state" class="form-label fw-semibold">State</label>
            <select class="form-select" id="state">
              <option selected>Pick a state</option>
              <option>California</option>
              <option>Texas</option>
              <option>New York</option>
              <option>Florida</option>
            </select>
          </div>
          <div class="col-md-3">
            <label for="postal" class="form-label fw-semibold">Postal Code</label>
            <input type="text" class="form-control" id="postal" />
          </div>
        </div>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold d-block">We accept:</label>
            <div class="d-flex flex-wrap gap-2">
              <label class="d-flex align-items-center gap-2 bg-dark text-white px-2 py-1 rounded">
                <input type="radio" name="payment" class="form-check-input m-0" />
                <i class="bi bi-credit-card-2-front-fill fs-5"></i>
              </label>
              <label class="d-flex align-items-center gap-2 bg-dark text-white px-2 py-1 rounded">
                <input type="radio" name="payment" class="form-check-input m-0" />
                <i class="bi bi-credit-card-fill fs-5"></i>
              </label>
              <label class="d-flex align-items-center gap-2 bg-dark text-white px-2 py-1 rounded">
                <input type="radio" name="payment" class="form-check-input m-0" />
                <i class="bi bi-paypal fs-5"></i>
              </label>
              <label class="d-flex align-items-center gap-2 bg-dark text-white px-2 py-1 rounded">
                <input type="radio" name="payment" class="form-check-input m-0" />
                <i class="bi bi-cash-coin fs-5"></i>
              </label>
            </div>
          </div>
          <div class="col-md-6">
            <label for="message" class="form-label fw-semibold">Message</label>
            <textarea class="form-control" id="message" rows="3"></textarea>
            <small class="text-muted">Add any notes here.</small>
          </div>
        </div>
      </div>
      <div class="card-footer bg-light text-end py-3">
        <button type="button" class="btn btn-secondary">Cancel</button>
        <button type="button" class="btn btn-primary">Send</button>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
